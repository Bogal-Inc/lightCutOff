name: lint and test on PR
'on': pull_request
jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Use Node 12.18.2
        uses: actions/setup-node@v1
        with:
          node-version: '12.18.2'

      - name: Install dependances
        run: npm ci

      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test:ci
