# COPIE À REPORTER MANUELLEMENT dans .github/workflows/firebase-hosting-merge.yml
# (l'agent n'a pas la permission de modifier les fichiers de workflows GitHub)
# Changements : checkout@v4 + setup-node@v4 (Node 22, cache npm)

name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependances
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Test
        run: npm run test:ci

      - name: Run build
        run: npm run build:prod
        env:
          ENVIRONMENT: prod
          PRODUCTION: true
          DOMAIN_DEV: localhost
          DOMAIN_PROD: https://www.lightcutoff.com
          MAILCHIMP_ENDPOINT: '${{ secrets.MAILCHIMP_ENDPOINT }}'
          FIREBASE_API_KEY: '${{ secrets.FIREBASE_API_KEY }}'
          FIREBASE_AUTH_DOMAIN: '${{ secrets.FIREBASE_AUTH_DOMAIN }}'
          FIREBASE_DATABASE_URL: '${{ secrets.FIREBASE_DATABASE_URL }}'
          FIREBASE_PROJECT_ID: '${{ secrets.FIREBASE_PROJECT_ID }}'
          FIREBASE_STORAGE_BUCKET: '${{ secrets.FIREBASE_STORAGE_BUCKET }}'
          FIREBASE_MESSAGING_SENDER_ID: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}'
          FIREBASE_APP_ID: '${{ secrets.FIREBASE_APP_ID }}'
          FIREBASE_MEASUREMENT_ID: '${{ secrets.FIREBASE_MEASUREMENT_ID }}'
          VALID_PUBLIC_KEY: '${{ secrets.VALID_PUBLIC_KEY }}'
          GOOGLE_MAPS_API_KEY: '${{ secrets.GOOGLE_MAPS_API_KEY }}'

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIGHTCUTOFF }}'
          channelId: live
          projectId: lightcutoff
