<div class="admin-login d-flex align-items-center justify-content-center">
  <div class="card admin-login__card text-center">
    <div class="card-body">
      <fa-icon [icon]="faShieldHalved" size="2x" class="admin-login__card__icon"></fa-icon>
      <h1 class="h4 mt-3">{{'admin.login.title' | translate}}</h1>
      <p class="text-muted">{{'admin.login.subtitle' | translate}}</p>

      <button type="button" class="btn admin-login__card__btn w-100"
              [disabled]="busy" (click)="signInWithGoogle()">
        <img src="assets/static/images/icons/google.svg" alt="" width="18" height="18"
             onerror="this.style.display='none'">
        {{'admin.login.google_btn' | translate}}
      </button>

      <div class="admin-login__sep my-3"><span>{{'admin.login.or' | translate}}</span></div>

      <form (ngSubmit)="signInWithEmail()">
        <input type="email" class="form-control mb-2" name="email"
               [(ngModel)]="email" [disabled]="busy" autocomplete="username"
               [placeholder]="'admin.login.email' | translate">
        <input type="password" class="form-control mb-2" name="password"
               [(ngModel)]="password" [disabled]="busy" autocomplete="current-password"
               [placeholder]="'admin.login.password' | translate">
        <button type="submit" class="btn btn-dark w-100"
                [disabled]="busy || !email || !password">
          {{'admin.login.email_btn' | translate}}
        </button>
      </form>

      <button type="button" class="btn btn-link btn-sm mt-2 p-0"
              [disabled]="busy" (click)="sendReset()">
        {{'admin.login.forgot' | translate}}
      </button>

      <p class="alert alert-success mt-3 mb-0" *ngIf="resetSent">
        {{'admin.login.reset_sent' | translate}}
      </p>
      <p class="alert alert-danger mt-3 mb-0" *ngIf="authError">
        {{authError | translate}}
      </p>
      <p class="alert alert-warning mt-3 mb-0" *ngIf="denied">
        {{'admin.login.denied' | translate}}
      </p>
    </div>
  </div>
</div>
