<div class="map-container">
  <app-map-not-found *ngIf="isErrorMapActive"></app-map-not-found>

  <div class="map-container">
    <app-map-menu [reports]="reports" (goToMarkerEnd)="goToMarker($event)" (researchPlace)="onSearchPlace($event)"
                  [class.d-none]="!isFormLightCutOf" (filterMarker)="mapFiltered($event);"></app-map-menu>
    <div #mapContainer id="map" class="map-container__map">
<!--loading init map page-->
      <app-loading [show]="isLoader"></app-loading>
<!--loading between forms of window marker-->
      <app-loading [show]="formLoader"></app-loading>

      <app-map-legend [class.d-none]="!isFormLightCutOf"></app-map-legend>

      <app-create-form-report (reportSubmit)="onCreateReport($event)"
                              [class.d-none]="!isFormLightCutOf"></app-create-form-report>

      <ng-template #recovredFormReport></ng-template>
      <ng-template #infosReport></ng-template>

      <div [class.d-none]="!isFormLightCutOf" class="map-container__btn" #btnAddReport>
          <button [ngbTooltip]="tooltipContent" tooltipClass="tooltip-content"
                  class="btn btn-success btn-lg map-container__btn__add" #tleft="ngbTooltip"
                  (click)="openInfoWindowCreateReport()"
                  attr.aria-label="{{'main.map-view.btn_add_report' | translate}}">
            <i class="fas fa-plus"></i>
          </button>
      </div>
      <div [class.d-none]="!isFormLightCutOf" #btnSwitchForm>
        <div class="mb-3">{{'main.map-view.swicth_form_title' | translate}}</div>
        <div class="d-flex justify-content-center">
          <button class="btn btn-light me-5" (click)="switchForm(false)">
            {{'main.map-view.switch_btn_no' | translate}}
          </button>
          <button class="btn btn-success" (click)="switchForm(true)">
            {{'main.map-view.switch_btn_yes' | translate}}
          </button>
        </div>
      </div>
    </div>

  <ng-template #tooltipContent>
    <div>
      {{"main.map-view.message_add_report" | translate}}
    </div>
  </ng-template>
</div>
