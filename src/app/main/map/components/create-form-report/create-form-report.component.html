<div class="report" *ngIf="!lastReport">
    <h5 class="text-center">Signalez une coupure</h5>
    <hr class="mb-4">
    <div class="alert alert-warning text-center">
        <i class="fas fa-info-circle"></i> Assurez-vous que vous êtes bien positionnez sur la map
    </div>
    <div class="mb-2">
        Quant est-ce que vous n'avez plus eu d'énergie électrique?
    </div>
    <div class="report__form">
        <div class="form-group">
            <div class="input-group">
                <input [owlDateTimeTrigger]="dt" [owlDateTime]="dt" [min]="min" [max]="max" placeholder="Date et heure de la coupure" class="form-control form-control-sm" [(ngModel)]="datetime" #ctrl="ngModel">
                <owl-date-time #dt></owl-date-time>
                <div class="text-danger">
                    <div *ngIf="datetime?.invalid && datetime?.errors.owlDateTimeMin">
                        Date Time value must after {{min | date: 'medium'}}
                    </div>
                    <div *ngIf="datetime?.invalid && datetime?.errors.owlDateTimeMax">
                        Date Time value must before {{max | date: 'medium'}}
                    </div>
                </div>
            </div>
        </div>
        <div class="text-center">
            <button class="btn btn-small btn-primary" (click)="onSubmitReport()" [disabled]="!datetime">Signalez</button>
        </div>
    </div>
</div>
