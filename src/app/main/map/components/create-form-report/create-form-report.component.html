<div class="cuttoff" *ngIf="!lastReport">
    <div class="cuttoff__box">
        <h5 class="text-center">Faites un rapport</h5>
        <hr class="mb-4">
        <p>Quant est-ce que vous n'avez plus eu d'énergie électrique?</p>
        <div class="form">
            <div class="form-group">
                <div class="input-group">
                    <input [owlDateTimeTrigger]="dt" [owlDateTime]="dt" [min]="min" [max]="max" placeholder="Date Time" class="form-control form-control-sm" [(ngModel)]="datetime" #ctrl="ngModel">
                    <owl-date-time #dt></owl-date-time>
                    <div class="text-danger">
                        <div *ngIf="datetime?.invalid && datetime?.errors.owlDateTimeMin">
                            Date Time value must after {{min | date: 'medium'}}
                        </div>
                        <div *ngIf="datetime?.invalid && datetime?.errors.owlDateTimeMax">
                            Date Time value must before {{max | date: 'medium'}}
                        </div>
                    </div>
                </div>
            </div>
            <div class="text-center">
                <button class="btn btn-small btn-primary" (click)="onSubmitReport()" [disabled]="!datetime">Enregistrer</button>
            </div>
        </div>
    </div>
</div>
