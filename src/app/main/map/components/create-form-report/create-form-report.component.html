<div class="cuttoff" *ngIf="!lastReport">
    <div class="cuttoff__box">
        <h5 class="text-center">Faites un rapport</h5>
        <hr class="mb-4">
        <p>Quant est-ce que vous n'avez plus eu d'énergie électrique?</p>
        <form [formGroup]="reportForm" (ngSubmit)="onSubmitReport()">
            <div class="form">
                <div class="form-group">
                    <div class="input-group">
                        <input type="text" class="form-control form-control-sm" placeholder="Date de debut" ngbDatepicker #sd="ngbDatepicker" formControlName="reportedAt" [ngClass]="{ 'is-invalid': submitted && f.reportedAt.errors }">
                        <div class="input-group-append">
                            <button class="btn btn-sm btn-outline-secondary" (click)="sd.toggle()" type="button"><i class="far fa-calendar-alt"></i></button>
                        </div>
                    </div>
                    <div *ngIf="submitted && f.reportedAt.errors" class="invalid-feedback">
                        <div *ngIf="f.reportedAt.errors.required">une date est requise</div>
                    </div>
                </div>
                <div class="form-group">
                    <ngb-timepicker [spinners]="true" [size]="'small'" formControlName="reportedHour" [ngClass]="{ 'is-invalid': submitted && f.reportedHour.errors }"></ngb-timepicker>
                    <div *ngIf="submitted && f.reportedHour.errors" class="invalid-feedback">
                        <div *ngIf="f.reportedHour.errors.required">une heure est requise</div>
                    </div>
                </div>
                <div class="text-center">
                    <button class="btn btn-small btn-primary" type="submit">Enregistrer</button>
                </div>
            </div>
        </form>
    </div>
</div>
