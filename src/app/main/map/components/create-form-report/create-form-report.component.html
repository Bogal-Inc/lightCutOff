<div class="report" *ngIf="!lastReport">
    <h5 class="text-center">{{ "main.create-form-report.title" | translate }}</h5>
    <hr class="mb-4">
    <div class="alert alert-warning text-center">
        <i class="fas fa-info-circle"></i> {{ "main.create-form-report.warning_message" | translate }}
    </div>
    <div class="mb-2">
        {{ "main.create-form-report.label_date" | translate }}
    </div>
    <div class="report__form">
        <div class="form-group">
            <div class="input-group">
                <input
                  [owlDateTimeTrigger]="dt"
                  [owlDateTime]="dt"
                  [min]="min"
                  [max]="max"
                  class="form-control form-control-sm"
                  [(ngModel)]="datetime" #ctrl="ngModel">
                <owl-date-time #dt></owl-date-time>
            </div>
        </div>
        <div class="text-center">
            <button class="btn btn-small btn-primary" (click)="onSubmitReport()" [disabled]="!datetime">
              {{ "main.create-form-report.button_submit" | translate }}
            </button>
        </div>
    </div>
</div>
