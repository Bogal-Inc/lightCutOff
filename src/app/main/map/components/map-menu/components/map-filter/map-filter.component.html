<div class="filter" *ngIf="moduleEnable">
  <div class="filter__segments" role="group">
    <button type="button" class="filter__segments__segment"
            [class.filter__segments__segment--active]="service === null"
            (click)="setService(null)">
      {{'main.map-filter.service_all' | translate}}
    </button>
    <button type="button" class="filter__segments__segment filter__segments__segment--electricity"
            [class.filter__segments__segment--active]="service === serviceType.ELECTRICITY"
            (click)="setService(serviceType.ELECTRICITY)">
      {{'main.map-filter.service_electricity' | translate}}
    </button>
    <button type="button" class="filter__segments__segment filter__segments__segment--water"
            [class.filter__segments__segment--active]="service === serviceType.WATER"
            (click)="setService(serviceType.WATER)">
      {{'main.map-filter.service_water' | translate}}
    </button>
  </div>

  <button type="button" class="filter__toggle" (click)="toggleExpanded()"
          [attr.aria-expanded]="expanded">
    <fa-icon [icon]="faSlidersH"></fa-icon>
    {{'main.map-filter.filters_btn' | translate}}
    <span class="filter__toggle__count" *ngIf="activeCount > 0">{{activeCount}}</span>
  </button>

  <div class="filter__sheet" [class.filter__sheet--open]="expanded">
    <div class="filter__sheet__label">{{'main.map-filter.status_label' | translate}}</div>
    <div class="filter__sheet__chips">
      <button type="button" class="filter__sheet__chips__chip"
              [class.filter__sheet__chips__chip--active]="isStatusActive(reportStatus.ONGOING)"
              (click)="toggleStatus(reportStatus.ONGOING)">
        <span *ngIf="isStatusActive(reportStatus.ONGOING)">✓ </span>{{'main.map-filter.status_ongoing' | translate}}
      </button>
      <button type="button" class="filter__sheet__chips__chip"
              [class.filter__sheet__chips__chip--active]="isStatusActive(reportStatus.RESOLVED)"
              (click)="toggleStatus(reportStatus.RESOLVED)">
        <span *ngIf="isStatusActive(reportStatus.RESOLVED)">✓ </span>{{'main.map-filter.status_resolved' | translate}}
      </button>
    </div>

    <div class="filter__sheet__label">{{'main.map-filter.sort_label' | translate}}</div>
    <div class="filter__sheet__chips">
      <button type="button" class="filter__sheet__chips__chip"
              [class.filter__sheet__chips__chip--active]="sort === 'recent'"
              (click)="setSort('recent')">
        {{'main.map-filter.sort_recent' | translate}}
      </button>
      <button type="button" class="filter__sheet__chips__chip"
              [class.filter__sheet__chips__chip--active]="sort === 'active'"
              (click)="setSort('active')">
        {{'main.map-filter.sort_active' | translate}}
      </button>
      <button type="button" class="filter__sheet__chips__chip"
              [class.filter__sheet__chips__chip--active]="sort === 'confirmed'"
              (click)="setSort('confirmed')">
        {{'main.map-filter.sort_confirmed' | translate}}
      </button>
    </div>
  </div>
</div>
