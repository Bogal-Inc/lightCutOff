<div class="container-fluid">
    <div class="row  justify-content-center search-place">
        <div class="col-md-5 search-place__bloc">
            <form class="form-inline search-place__bloc__form" [formGroup]="searchPlaceForm" (ngSubmit)="onSubmit()">
                <div class="input-group">
                    <input type="text" formControlName="query" class="form-control" placeholder="Rechercher une place">
                    <div class="input-group-append">
                        <button type="submit" class="btn btn-success">
                      <i class="fas fa-search"></i>
                    </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
