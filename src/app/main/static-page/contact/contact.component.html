<div class="contact-page">
    <!-- bandeau d'entête charbon (normes visuelles du site) -->
    <section class="contact-page__section contact-page__hero text-center">
        <div class="container">
            <img src="../../../../assets/static/images/njuka/njuka_foreground.png"
                 alt="NJUKA" width="72">
            <h1 class="mt-3 section-title section-title--on-dark">{{'core.home.contactus.title' | translate}}</h1>
            <p class="contact-page__hero__subtitle mx-auto">{{'core.home.contactus.subtitle' | translate}}</p>
        </div>
    </section>

    <!-- formulaire -->
    <section class="contact-page__section">
        <div class="container">
            <div class="contact-page__card mx-auto">
                <app-contact-us></app-contact-us>
            </div>
            <p class="text-center text-muted mt-4">
                {{'core.contact.email_hint' | translate}}
                <a [href]="'mailto:' + supportEmail">{{supportEmail}}</a>
            </p>
        </div>
    </section>

    <!-- réseaux sociaux -->
    <section class="contact-page__section contact-page__section--soft">
        <div class="container text-center">
            <h2 class="mb-5 section-title">{{'core.contact.social_title' | translate}}</h2>
            <div class="contact-page__social">
                <a *ngFor="let social of socialLinks" [href]="social.url" target="_blank" rel="noopener"
                   class="contact-page__social__link" [attr.aria-label]="social.label">
                    <i [class]="social.icon"></i>
                    <span>{{social.label}}</span>
                </a>
            </div>
        </div>
    </section>
</div>
