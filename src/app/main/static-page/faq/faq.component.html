<div class="main-admin">
  <div class="container">
    <div class="mb-5">
      <h1 class="text-center">{{'core.faq.title' | translate: {projectTitle: projectTitle} }}</h1>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="accordion m-auto" id="accordionExample">
          <div class="card">
            <div class="card-header" id="headingOne">
              <h2 class="mb-0">
                <button class="btn btn-link w-100 text-start" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                  {{'core.faq.question_1' | translate: {projectTitle: projectTitle} }}
                </button>
              </h2>
            </div>

            <div id="collapseOne" class="collapse show" aria-labelledby="headingOne" data-parent="#accordionExample">
              <div class="card-body">
                {{'core.faq.response_1' | translate: {projectTitle: projectTitle} }}
              </div>
            </div>
          </div>
          <div class="card">
            <div class="card-header" id="headingTwo">
              <h2 class="mb-0">
                <button class="btn btn-link w-100 text-start collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                  {{'core.faq.question_2' | translate: {projectTitle: projectTitle} }}
                </button>
              </h2>
            </div>
            <div id="collapseTwo" class="collapse" aria-labelledby="headingTwo" data-parent="#accordionExample">
              <div class="card-body" [innerHTML] = "'core.faq.response_2' | translate: {projectTitle: projectTitle}">
              </div>
            </div>
          </div>
          <div class="card">
            <div class="card-header" id="headingThree">
              <h2 class="mb-0">
                <button class="btn btn-link w-100 text-start collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
                  {{'core.faq.question_3' | translate: {projectTitle: projectTitle} }}
                </button>
              </h2>
            </div>
            <div id="collapseThree" class="collapse" aria-labelledby="headingThree" data-parent="#accordionExample">
              <div class="card-body">
                <p>{{'core.faq.question_intro' | translate}}</p>
                <div>
                  <h2>{{'core.faq.question_title_1' | translate}}</h2>
                  <ol>
                    <li [innerHTML]="'core.faq.question_title_1_li_1' | translate"></li>
                    <li [innerHTML]="'core.faq.question_title_1_li_2' | translate"></li>
                    <li [innerHTML]="'core.faq.question_title_1_li_3' | translate"></li>
                    <li [innerHTML]="'core.faq.question_title_1_li_4' | translate"></li>
                    <li [innerHTML]="'core.faq.question_title_1_li_5' | translate"></li>
                  </ol>
                </div>
                <div>
                  <h2>{{'core.faq.question_title_2' | translate}}</h2>
                  <ol>
                    <li [innerHTML]="'core.faq.question_title_2_li_1' | translate"></li>
                    <li [innerHTML]="'core.faq.question_title_2_li_2' | translate"></li>
                    <li [innerHTML]="'core.faq.question_title_2_li_3' | translate"></li>
                    <li [innerHTML]="'core.faq.question_title_2_li_4' | translate"></li>
                  </ol>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-6"></div>
    </div>
  </div>
</div>
