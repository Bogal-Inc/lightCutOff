  <div class="container">
    <div class="mb-5">
      <h1 class="text-center">FAQ</h1>

    <div class="row">
      <div class="col-md-6">
        <div class="accordion m-auto" id="accordionExample">
          <div class="card">
            <div class="card-header" id="headingOne">
              <h2 class="mb-0">
                <button class="btn btn-link btn-block text-left" type="button" data-toggle="collapse"
                        data-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                  {{'core.faq.question_1' | translate: {projectTitle: projectTitle} }}
                </button>
              </h2>
            </div>

            <div id="collapseOne" class="collapse show" aria-labelledby="headingOne" data-parent="#accordionExample">
              <div class="card-body">
                {{'core.faq.response_1' | translate: {projectTitle: projectTitle} }}
              </div>
            </div>
          </div>
          <div class="card">
            <div class="card-header" id="headingTwo">
              <h2 class="mb-0">
                <button class="btn btn-link btn-block text-left collapsed" type="button" data-toggle="collapse"
                        data-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                  {{'core.faq.question_2' | translate: {projectTitle: projectTitle} }}
                </button>
              </h2>
            </div>
            <div id="collapseTwo" class="collapse" aria-labelledby="headingTwo" data-parent="#accordionExample">
              <div class="card-body" [innerHTML] = "'core.faq.response_2' | translate: {projectTitle: projectTitle}">
              </div>
            </div>
          </div>
