<div class="aboutus">
    <!-- bandeau d'entête charbon (mêmes codes que le hero de l'accueil) -->
    <section class="aboutus__section aboutus__hero text-center">
        <div class="container">
            <img src="../../../../assets/static/images/njuka/njuka_foreground.png"
                 alt="NJUKA" width="72">
            <h1 class="mt-3 section-title section-title--on-dark">{{'core.aboutus.title_page' | translate}}</h1>
        </div>
    </section>

    <!-- notre histoire -->
    <section class="aboutus__section">
        <div class="container">
            <h2 class="mb-5 section-title">{{'core.aboutus.title_history' | translate}}</h2>
            <p class="lead aboutus__text mx-auto"
               [innerHTML]="'core.aboutus.text_history_1' | translate"></p>
        </div>
    </section>

    <!-- notre mission -->
    <section class="aboutus__section aboutus__section--soft">
        <div class="container">
            <h2 class="mb-5 section-title">{{'core.aboutus.title_obj_1' | translate}}</h2>
            <p class="lead aboutus__text mx-auto"
               [innerHTML]="'core.aboutus.text_obj_1' | translate"></p>
        </div>
    </section>

    <!-- notre vision -->
    <section class="aboutus__section aboutus__section--dark">
        <div class="container">
            <h2 class="mb-5 section-title section-title--on-dark">{{'core.aboutus.title_obj_2' | translate}}</h2>
            <p class="lead aboutus__text aboutus__text--on-dark mx-auto"
               [innerHTML]="'core.aboutus.text_obj_2' | translate"></p>
            <div class="mt-5 text-center aboutus__badges">
                <a [href]="playStoreUrl" target="_blank" rel="noopener">
                    <img [src]="'core.home.hero.badge_playstore_src' | translate"
                         [alt]="'core.home.hero.badge_playstore_alt' | translate"
                         class="aboutus__badges__badge">
                </a>
                <a [href]="appStoreUrl" target="_blank" rel="noopener">
                    <img [src]="'core.home.hero.badge_appstore_src' | translate"
                         [alt]="'core.home.hero.badge_appstore_alt' | translate"
                         class="aboutus__badges__badge">
                </a>
            </div>
        </div>
    </section>
</div>
