<div class="main-admin register">
  <div class="text-center mb-3 register__logo">
    <img
      src="../../../../assets/static/images/logo_text_lightcutoff_LCO.jpg"
      class="w-25"
      alt="logo text lightcutoff"
    >
  </div>
  <div class="d-flex justify-content-center">
    <div class="register__bloc">
      <h1 class="text-center register__bloc__title">
        {{'user.register.title' | translate}}
      </h1>

      <p class="register__bloc__text" [innerHTML]="'user.signup.reason_signup' | translate">

      </p>
      <app-signup-form (submited)="onSubmit($event)"></app-signup-form>
    </div>
  </div>
</div>
