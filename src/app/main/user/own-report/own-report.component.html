<div class="main-admin reports">
  <div class="container">
    <div *ngIf="reports$ | async">
      <h4 class="text-center reports__title mb-5">{{'main.user-profile.title' | translate}}</h4>

      <ag-grid-angular
        class="ag-theme-alpine reports__datatable"
        [rowData]="reports$ | async"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
      >
      </ag-grid-angular>
    </div>
  </div>

</div>
