<div class="main-admin signin">
  <div class="text-center mb-3 register__logo">
    <img
      src="../../../../assets/static/images/logo_text_lightcutoff_LCO.jpg"
      class="w-25"
      alt="logo text lightcutoff"
    >
  </div>
  <div class="d-flex justify-content-center">
    <div class="signin__bloc">
      <h1 class="mb-4 text-center signin__title">
        {{'user.signin.title' | translate}}
      </h1>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <input type="email" class="form-control" placeholder="{{'user.signin.mail' | translate}}"
                 formControlName="email">
        </div>

        <div class="form-group">
          <input type="password" class="form-control" placeholder="password" formControlName="password">
        </div>

        <div>
          <button class="btn btn-warning w-100">{{'user.signin.btn_submit' | translate}}</button>
          <br>
          <button class="btn btn-link" routerLink="/forgot-password">{{"user.register.btn_password_forget" | translate}}</button>
          <button class="btn btn-link" routerLink="/signup">{{"shared.main-header.signup" | translate}}</button>
        </div>
      </form>

      <div *ngIf="reactiveEmail" class="mt-3 alert alert-warning">
        {{'user.signin.signin_verified_email_message' | translate}}
        <a class="alert-link" (click)="sendEmailVerification()">
          {{'user.signin.signin_verified_email_message_2' | translate}}
        </a>
      </div>
    </div>
  </div>

  <div class="col-md-6">
  </div>
</div>
