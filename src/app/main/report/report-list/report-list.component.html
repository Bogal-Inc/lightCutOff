<div class="main-admin">
  <h1 class="pt-4 text-center">{{'shared.admin-nav.reports' | translate}}</h1>
  <hr>

  <div class="container-fluid">
    <div class="reports__datatable" *ngIf="(reports$ | async) !== undefined; else datatableEmpty">
      <app-report-details *ngIf="!isMobile"
        (showDetail)="close($event)"
        [detailReportLightRight]="detailReportLightRight"
        [report]="reportSelected"
        class="d-flex justify-content-end"></app-report-details>
      <ag-grid-angular
        class="ag-theme-alpine reports__datatable__table"
        [rowData]="reports$ | async"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [rowSelection]="rowSelection"
        (gridReady)="onGridReady($event)"
        (selectionChanged)="onRowSelected($event)"
      >
      </ag-grid-angular>
    </div>
    <ng-template #datatableEmpty>
      <div class="alert alert-warning text-center" role="alert">
        <fa-icon [icon]="faExclamationCircle"></fa-icon>
      </div>
    </ng-template>
  </div>
</div>
