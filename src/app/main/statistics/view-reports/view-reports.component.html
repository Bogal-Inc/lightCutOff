<div class="main-statistics">
  <h1 class="text-center pt-4">{{'shared.admin-nav.reports' | translate}}</h1>
  <hr>

  <div class="container-fluid">
    <div class="col reports__datatable" *ngIf="(reports$ | async) !== undefined; else datatableEmpty">
      <ag-grid-angular
        class="ag-theme-alpine reports__datatable__table"
        [rowData]="reports$ | async"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
      >
      </ag-grid-angular>
    </div>
    <ng-template #datatableEmpty>
      <div class="alert alert-warning text-center" role="alert">
        <fa-icon [icon]="faExclamationCircle"></fa-icon>
      </div>
    </ng-template>
  </div>
</div>
