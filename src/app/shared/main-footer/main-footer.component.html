<app-download-app></app-download-app>
<footer class="footer">
    <div class="d-flex justify-content-between">
        <div class="d-flex justify-content-start footer__line">
            <ul class="nav footer__line__menu">
              <li class="nav-item">
                <a class="nav-link footer__line__menu__link" href="/tuto">
                  {{ 'shared.main-footer.tutorial' | translate}}
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link footer__line__menu__link" href="/aboutus">
                  {{ 'shared.main-footer.about' | translate}}
                </a>
              </li>
              <li class="nav-item">
                  <a class="nav-link footer__line__menu__link" href="#contactus">
                    {{ 'shared.main-footer.contactus' | translate}}
                  </a>
              </li>
            </ul>
        </div>
        <div class="d-flex justify-content-end">
            <ul class="nav">
                <li *ngIf="currentLang === 'en'" class="nav-item">
                  <a (click)="toggleLang()" class="nav-link">
                    <img src="./../../../assets/static/icons/france.png" alt="flag_french" class="lang-flag">
                    Francais
                  </a>
                </li>
                <li *ngIf="currentLang === 'fr'" class="nav-item">
                  <a (click)="toggleLang()" class="nav-link">
                    <img src="./../../../assets/static/icons/england.png" alt="flag_england" class="lang-flag">
                    English
                  </a>
                </li>
            </ul>
        </div>
    </div>
    <div class="footer__line">
        <small>Copyright © 2020 by {{ appTitle }}</small>
    </div>
</footer>
