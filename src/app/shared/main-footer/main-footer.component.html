<app-download-app *ngIf="isAppDownload"></app-download-app>
<footer class="footer">
    <div class="d-flex justify-content-between">
        <div class="d-flex justify-content-start footer__line">
            <ul class="nav">
              <li class="nav-item">
                <a class="nav-link" routerLink="/tuto" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
                  {{ 'shared.main-footer.tutorial' | translate}}
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" routerLink="/aboutus" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
                  {{ 'shared.main-footer.about' | translate}}
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" routerLink="/faq" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
                  FAQ
                </a>
              </li>
              <li class="nav-item">
                  <a class="nav-link" routerLink="#contactus" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
                    {{ 'shared.main-footer.contactus' | translate}}
                  </a>
              </li>
            </ul>
        </div>
        <div class="d-flex justify-content-center">
          <ul class="list-inline">
            <li class="p-1 list-inline-item">
              <a><i class="fab fa-facebook-f"></i></a>
            </li>
            <li class="p-1 list-inline-item">
              <a><i class="fab fa-twitter"></i></a>
            </li>
          </ul>
        </div>
        <div class="d-flex justify-content-end">
            <ul class="nav">
                <li *ngIf="currentLang === 'en'" class="nav-item">
                  <a (click)="toggleLang()" class="nav-link" href="#">
                    <img src="./../../../assets/static/icons/france.png" alt="flag_french" class="lang-flag">
                    Francais
                  </a>
                </li>
                <li *ngIf="currentLang === 'fr'" class="nav-item">
                  <a (click)="toggleLang()" class="nav-link" href="#">
                    <img src="./../../../assets/static/icons/england.png" alt="flag_england" class="lang-flag">
                    English
                  </a>
                </li>
            </ul>
        </div>
    </div>
    <div class="text-center">
        <small>Copyright © {{ now.getFullYear() }} by {{ appTitle }} All Rights Reserved.</small>
    </div>
</footer>
