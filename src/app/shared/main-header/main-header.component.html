<nav class="navbar navbar-expand-lg navbar-dark bg-dark" [class.mt-4]="isGlobalMessage">
  <a class="navbar-brand d-flex align-items-center" href="/" attr.aria-label="{{'shared.main-header.home' | translate}}">
    <img src="../../../assets/static/images/njuka/njuka_foreground.png"
         class="d-inline-block navbar-brand__bulb" height="36"
         alt="logo NJUKA" loading="lazy">
    <span class="navbar-brand__name">{{appTitle}}</span>
  </a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo01"
          aria-controls="navbarTogglerDemo01" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
    <ul class="navbar-nav me-auto mt-2 mt-lg-0">
      <li class="nav-item" *ngFor="let section of sectionLinks">
        <a class="nav-link" [class.active]="activeSection === section.fragment"
           routerLink="/" [fragment]="section.fragment">
          {{'core.home.nav.' + section.label | translate}}
        </a>
      </li>
      <li class="nav-item dropdown" *ngIf="isModuleAdmin" [class.active]="adminActive">
        <a role="button" data-bs-toggle="dropdown" aria-haspopup="true"
           aria-expanded="false" class="nav-link dropdown-toggle">
          {{"shared.main-header.statistics" | translate}}
        </a>
        <div class="dropdown-menu bg-dark" aria-labelledby="navbarDropdown">
          <a routerLink="/admin/dashboard" class="dropdown-item">
            {{'shared.admin-nav.dashboard' | translate}}
          </a>
          <a class="dropdown-item" routerLink="/admin/reports">
            {{'shared.admin-nav.reports' | translate}}
          </a>
          <a class="dropdown-item" routerLink="/admin/statistics_numbers">
            {{'shared.admin-nav.figures' | translate}}
          </a>
        </div>
      </li>
    </ul>
    <div class="navbar-lang">
      <a class="navbar-lang__option" [class.navbar-lang__option--active]="currentLang === 'fr'"
         (click)="setLang('fr')" role="button" aria-label="Français">FR</a>
      <span class="navbar-lang__sep">|</span>
      <a class="navbar-lang__option" [class.navbar-lang__option--active]="currentLang === 'en'"
         (click)="setLang('en')" role="button" aria-label="English">EN</a>
    </div>
  </div>
</nav>
